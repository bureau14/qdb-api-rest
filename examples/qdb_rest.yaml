# qdb_rest reference configuration: every key, at its built-in default.
# internal/config's tests pin it to those defaults.
#
# Load with `qdb_rest --config /etc/qdb/qdb_rest.yaml`. Every key is also
# an environment variable and a flag named after its path (pool.max_sessions
# is QDB_REST_POOL_MAX_SESSIONS and --pool-max-sessions). Precedence, lowest
# to highest: these defaults, this file, the environment, flags. The loader
# expands `${VAR}` references from the environment at load time, and an
# unset variable refuses the start.

listen:
  # HTTP listener address. Off unless set, and the only listener that
  # can be off.
  # http: ":40080"
  # HTTPS listener address.
  https: ":40443"
  # Flight SQL listener address (gRPC over TLS, the HTTPS certificates).
  flight: ":40493"
  # Deadline for draining in-flight calls on every listener and then the
  # session pool on SIGTERM. Whatever stops the binary and then kills it
  # must wait longer than this before the kill. The readiness probe
  # answers 503 for the whole drain, so a load balancer that polls it
  # stops sending new connections before a listener closes.
  shutdown_grace: "8s"

tls:
  # PEM certificate and private key for the HTTPS listener, set together.
  # With both empty, an ephemeral self-signed certificate is generated at
  # every start.
  certificate: ""
  private_key: ""
  # private_key: "${QDB_REST_TLS_KEY_PATH}"

log:
  # debug | info | warn | error
  level: "info"
  # json (one object per line, for journald and container runtimes) |
  # text (key=value, for interactive use)
  format: "json"
  # Bytes of a query's statement that a debug line keeps. Longer statements
  # are truncated and end in "...". 0 keeps every statement whole.
  statement_max_bytes: 1024

cluster:
  # Cluster URI. Several nodes form a comma-separated list.
  uri: "qdb://127.0.0.1:2836"
  # Cluster public key file. Empty means an insecure cluster.
  public_key_file: ""
  # User security file of the REST API's own user, the one it
  # authenticates as on its own behalf (the readiness probe). Required
  # when the cluster has a public key, and empty means anonymous.
  user_security_file: ""
  # Client-side C API compression: none | balanced.
  compression: "none"
  # Client-cluster traffic encryption: none | aes.
  encryption: "none"
  # C API socket timeout per session, the bound on one low-level network
  # operation (a single send or receive, retried inside the C API).
  # Whole seconds, at least 1s, and 0 leaves the Go API's default.
  timeout: "0s"
  # Per session, with 0 as the C API default: the client input buffer cap
  # (bytes) and the C API worker threads (the C API default is half the
  # logical cores, per session).
  max_in_buffer_size: 0
  parallelism: 0
  # Per session, the soft limit on connections to any one node address
  # (0 is the C API default, otherwise 2..100000).
  connections_per_address: 0

pool:
  # Sessions this process may hold across all users. Readiness probes
  # dial outside this budget.
  max_sessions: 64
  # Sessions one user may hold, across all of that user's REST sessions.
  # The anonymous user is one user.
  per_user_max: 8
  # A session unused this long is closed, and a user pool that has held
  # no session for this long is evicted (so at most twice this after the
  # last request).
  idle_timeout: "5m"
  # A session older than this is closed instead of being reused.
  max_lifetime: "15m"
  breaker:
    # Consecutive retryable failures (dial errors, retryable C API
    # errors) that open the breaker.
    failures: 3
    # How long the breaker stays open before one call is let through.
    open_for: "10s"

status:
  # Query executed by the readiness probe, as the REST API's own user,
  # after the dial. The result is discarded.
  readiness_query: "SELECT 1"

auth:
  # Rolling token passphrases. The first entry mints tokens, and the rest
  # stay valid during rotation. When empty, tokens do not survive a
  # restart and do not span multiple instances.
  # token_secrets:
  #   - "${QDB_REST_TOKEN_SECRET}"
  argon2id:
    # Token key-derivation cost, which must be identical on every instance.
    time: 3
    memory_mib: 64
    parallelism: 4
  # Validity of an access token from its login.
  access_ttl: 15m
  # Validity of a refresh token from the login or refresh that minted it.
  # Fourteen days; durations have no day unit.
  refresh_ttl: 336h

duckdb:
  # Every limit is per DuckDB instance, and the server opens one instance
  # per user on that user's first sql call.
  # Memory one instance may use, in bytes (1 GiB).
  memory_limit: 1073741824
  # Worker threads of one instance. A scan takes one qdbd session per
  # worker thread.
  threads: 4
  # Directory an instance spills to when a query exceeds the memory
  # limit. Empty disables spilling, so such a query fails.
  spill_directory: ""
  # Bytes one instance may spill.
  max_spill_size: 0
  # Instances live at once. A sql call that would open one more answers
  # 503 until an idle user pool is evicted.
  max_instances: 16
  # The qdb-duck sessions behind one instance, set as qdb-duck's quasar_*
  # globals before the attach.
  quasar:
    # qdbd sessions qdb-duck pools behind one instance, 1 to 1024. A scan
    # takes one per DuckDB worker, and a catalog lookup can hold several.
    max_pool_size: 100
    # How long a qdb-duck session caches a table's metadata. 0 disables
    # the cache, so every lookup asks qdbd.
    table_cache_ttl: "1m"
    # Per session, with 0 as the C API default: the longest wait for an
    # unstable cluster and the longest retry of a conflicting
    # transaction, each at least cluster.timeout when both are set, and
    # the client-side soft memory limit in bytes.
    stabilization_max_wait: "0s"
    transaction_max_wait: "0s"
    soft_memory_limit: 0
    # Spread a session's requests across the nodes instead of pinning it
    # to one.
    load_balancing: false

metrics:
  # Serve the Prometheus exposition at GET /metrics on the HTTP and
  # HTTPS listeners, outside authentication. The scrape reads counters
  # held in this process and never touches the cluster.
  enabled: true
  # Prefix of every series this binary names (qdb_rest_build_info), so
  # several exporters on one host do not collide. The go_ and process_
  # series of the Go client keep their names. A name of letters, digits,
  # underscores and colons, not starting with a digit, and not empty.
  namespace: "qdb_rest"

debug:
  # Serve the Go runtime profiler under /debug/pprof/ on the HTTP and
  # HTTPS listeners, outside authentication, for goroutine, heap and
  # CPU profiles of a live instance. Off unless a profile is wanted.
  pprof: false
