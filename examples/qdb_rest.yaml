# qdb_rest reference configuration: every key, at its built-in default.
# Pinned to those defaults by internal/config's tests.
#
# Load with `qdb_rest --config /etc/qdb/qdb_rest.yaml`. Precedence, lowest
# to highest: these defaults, this file, QDB_REST_* environment variables,
# command-line flags. `${VAR}` references are expanded from the environment
# at load time; an unset variable refuses the start.

listen:
  # HTTP listener address; empty disables the listener.
  http: ":40080"
  # HTTPS listener address; empty disables the listener.
  https: ":40443"

tls:
  # PEM certificate and private key for the HTTPS listener, set together.
  # Both empty: an ephemeral self-signed certificate is generated at every
  # start (docs/adr/0001-tls-certificates.md).
  certificate: ""
  private_key: ""
  # private_key: "${QDB_REST_TLS_KEY_PATH}"

log:
  # debug | info | warn | error
  level: "info"
  # json (one object per line, for journald and container runtimes) |
  # console (human-readable, for interactive use)
  format: "json"
