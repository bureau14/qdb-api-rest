# qdb_rest reference configuration.
#
# Every key is listed commented out at its default value. Uncomment a key,
# together with the section headers above it, to change it.
#
# Load with `qdb_rest --config /etc/qdb/qdb_rest.yaml`. Every key is also
# an environment variable and a flag named after its path: pool.max_sessions
# is QDB_REST_POOL_MAX_SESSIONS and --pool-max-sessions. A flag overrides
# the environment, and the environment overrides this file.

#listen:
  # HTTP listener address. The HTTP listener is off unless this is set.
  #http: ""
  # HTTPS listener address.
  #https: ":40443"
  # Flight SQL listener address. Flight SQL is served over TLS only.
  #flight: ":40493"
  # Time in-flight requests get to finish on SIGTERM. The readiness probe
  # answers 503 during that time.
  #shutdown_grace: "8s"
  #tls:
    # PEM certificate and private key files of the HTTPS and Flight SQL
    # listeners, set together. With both empty, a self-signed certificate
    # is generated at every start.
    #certificate_file: ""
    #private_key_file: ""

#cluster:
  # Cluster URI. Several nodes form a comma-separated list.
  #uri: "qdb://127.0.0.1:2836"
  # Cluster public key file. Empty means an insecure cluster.
  #public_key_file: ""
  # User security file of the user the readiness probe connects as.
  # Required when the cluster has a public key. Empty means anonymous.
  #user_security_file: ""
  # Client-side compression: none | balanced.
  #compression: "none"
  # Encryption of the traffic to the cluster: none | aes.
  #encryption: "none"
  # Network timeout of a cluster connection, in whole seconds of at least
  # 1s. 0 keeps the client's default.
  #timeout: "0s"
  # The three keys below apply to each cluster connection, and 0 keeps the
  # client's default.
  # Largest input buffer, in bytes.
  #max_in_buffer_size: 0
  # Client worker threads.
  #parallelism: 0
  # Soft limit on connections to one node, 2 to 100000.
  #connections_per_address: 0

#pool:
  # Cluster sessions the server may hold across all users.
  #max_sessions: 64
  # Cluster sessions one user may hold. The anonymous user is one user.
  #per_user_max: 8
  # A session unused this long is closed.
  #idle_timeout: "5m"
  # A session older than this is closed instead of being reused.
  #max_lifetime: "15m"
  #breaker:
    # Consecutive retryable cluster errors after which the server stops
    # calling the cluster.
    #failures: 3
    # How long the server waits before it tries the cluster again.
    #open_for: "10s"

#auth:
  # Token passphrases. The first entry signs new tokens, and the others
  # keep older tokens valid during a rotation. When empty, tokens do not
  # survive a restart and are not valid on another instance.
  #token_secrets: []
  #argon2id:
    # Cost of deriving the token keys from the passphrases. Every instance
    # behind one load balancer must use the same values.
    #time: 3
    #memory_mib: 64
    #parallelism: 4
  # Validity of an access token.
  #access_ttl: "15m"
  # Validity of a refresh token. The default is fourteen days.
  #refresh_ttl: "336h"

#duckdb:
  # The server opens one DuckDB instance per user, and every limit below
  # applies to each instance.
  # Memory limit, in bytes. The default is 1 GiB.
  #memory_limit: 1073741824
  # Worker threads. A scan takes one cluster session per worker thread.
  #threads: 4
  # Directory for spilling to disk when a query exceeds the memory limit.
  # Empty disables spilling, so such a query fails.
  #spill_directory: ""
  # Bytes one instance may spill.
  #max_spill_size: 0
  # Instances open at once. When all are in use, a sql call from one more
  # user answers 503.
  #max_instances: 16
  #quasar:
    # Cluster sessions pooled behind one instance, 1 to 1024.
    #max_pool_size: 100
    # How long table metadata is cached. 0 disables the cache.
    #table_cache_ttl: "1m"
    # The two waits below are at least cluster.timeout when both are set,
    # and 0 keeps the client's default.
    # Longest wait for an unstable cluster.
    #stabilization_max_wait: "0s"
    # Longest retry of a conflicting transaction.
    #transaction_max_wait: "0s"
    # Client-side soft memory limit per session, in bytes. 0 keeps the
    # client's default.
    #soft_memory_limit: 0
    # Spread a session's requests across the nodes instead of pinning it
    # to one.
    #load_balancing: false

#observability:
  #status:
    # Query the readiness probe runs against the cluster.
    #readiness_query: "SELECT 1"
  #log:
    # debug | info | warn | error
    #level: "info"
    # json | text
    #format: "json"
    # Bytes of a query's statement that a debug line keeps. 0 keeps the
    # whole statement.
    #statement_max_bytes: 1024
  #metrics:
    # Serve Prometheus metrics at GET /metrics on the HTTP and HTTPS
    # listeners, without authentication.
    #enabled: true
    # Prefix of the metric names.
    #namespace: "qdb_rest"
    #duration_buckets:
      # Upper bound of the first bucket of every duration histogram. Each
      # next bound is double the one before.
      #start: "32ms"
      # Number of buckets.
      #count: 10
  # Serve the Go profiler under /debug/pprof/ on the HTTP and HTTPS
  # listeners, without authentication.
  #pprof: false
