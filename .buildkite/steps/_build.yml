label: ":hammer: build ({slug})"
key: build-{slug}

# The qdb-artifacts plugin extracts two packages for this step's variant:
# the c-api, server and utils dists into qdb/, the QuasarDB project
# layout, and qdb-duck's package (DuckDB with the quasar extension linked
# in) into duck/. The qdb-test-setup submodule (scripts/tests/setup/)
# starts qdbd from qdb/, and the build links the binary against both
# trees. The e2e harness (tests/e2e/) runs last, through
# scripts/cicd/40.test-e2e.sh, against that qdbd and the binary the build
# command produced (docs/e2e.md, "In Buildkite").

commands:
  - echo \"+++ Start services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/cicd/20.build.sh
  - echo \"+++ Tests\"
  - bash scripts/cicd/30.test.sh
  - echo \"+++ Tests - e2e\"
  - bash scripts/cicd/40.test-e2e.sh

plugins:
  - bureau14/qdb-artifacts#master:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
        - project_id: "qdb-duck"
          output-dir: "duck"
          extract: true
          files:
            - "artifacts/qdb-duck-*-libduckdb.tar.zst!*"
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"
        # 40.test-e2e.sh writes the archive only when the round trip
        # fails, and the plugin only warns when it is missing.
        artifacts:
          - name: "e2e round trip files"
            input_path: "e2e-round-trip.tar.gz"

timeout_in_minutes: 60

agents:
  queue: "{queue}"
