label: ":hammer: build ({slug})"
key: build-{slug}

# The qdb-test-setup submodule (scripts/tests/setup/) starts qdbd from the
# c-api, server and utils dists that the qdb-artifacts plugin extracts into
# qdb/, the QuasarDB project layout. The same plugin extracts qdb-duck's
# package (DuckDB with the quasar extension linked in) into duck/, from
# qdb-duck's master, under this step's own variant. pipeline.py removes
# that project on FreeBSD, where qdb-duck has no build. The e2e harness
# (tests/e2e/) runs last, through scripts/cicd/40.test-e2e.sh, against
# that qdbd and the binary the build command produced (docs/e2e.md, "In
# Buildkite").

commands:
  - echo \"+++ Start services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/cicd/20.build.sh
  - echo \"+++ Tests\"
  - bash scripts/cicd/30.test.sh
  - echo \"+++ Tests - e2e\"
  - bash scripts/cicd/40.test-e2e.sh

plugins:
  - bureau14/qdb-artifacts#master:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
        - project_id: "qdb-duck"
          output-dir: "duck"
          extract: true
          files:
            - "qdb-duck-*-libduckdb.tar.zst!*"
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"

timeout_in_minutes: 60

agents:
  queue: "{queue}"
