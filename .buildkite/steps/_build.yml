label: ":hammer: build ({slug})"
key: build-{slug}

# The C API, server and utils archives are downloaded: the test suite
# talks to a live qdbd, started here by the shared test-setup submodule.
# The e2e harness in tests/e2e/ is still not in CI (.buildkite/AGENTS.md).

commands:
  - echo \"+++ Start services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/cicd/20.build.sh
  - echo \"+++ Tests\"
  - bash scripts/cicd/30.test.sh

plugins:
  - bureau14/qdb-artifacts#master:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"

timeout_in_minutes: 60

agents:
  queue: "{queue}"
