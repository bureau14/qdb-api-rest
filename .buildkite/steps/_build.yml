label: ":hammer: build ({slug})"
key: build-{slug}

# The qdb-test-setup submodule (scripts/tests/setup/) starts qdbd from the
# c-api, server and utils dists that the qdb-artifacts plugin extracts into
# qdb/, the QuasarDB project layout. The e2e harness (tests/e2e/) is not
# in CI (.buildkite/AGENTS.md).
#
# The test step archives both qdbd daemons' logs into logs/ at its exit
# (scripts/cicd/30.test.sh) and the test-report plugin uploads them with the
# report, together with the rapid fail files a failed property test wrote
# and, on Windows, the system's record of the daemons (the Application and
# Defender events, the qdbd.exe processes alive) and the watcher's record of
# every qdbd.exe's exit code; the pre-exit hook runs after the upload, so its
# own archive is unused.

commands:
  - echo \"+++ Start services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/cicd/20.build.sh
  - echo \"+++ Tests\"
  - bash scripts/cicd/30.test.sh

plugins:
  - bureau14/qdb-artifacts#master:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"
        artifacts:
          - name: "qdbd logs"
            input_path: "logs/qdbd-logs-*.tar.gz"
          - name: "rapid fail files"
            input_path: "internal/**/testdata/rapid/**/*.fail"
          - name: "windows events"
            input_path: "logs/windows-events-*.txt"
          - name: "qdbd watch"
            input_path: "logs/qdbd-watch-*.txt"

timeout_in_minutes: 60

agents:
  queue: "{queue}"
