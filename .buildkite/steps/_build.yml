label: ":hammer: build ({slug})"
key: build-{slug}

# Only the C API archive is downloaded; the e2e harness is not in CI
# (.buildkite/AGENTS.md).

commands:
  - echo \"+++ Build\"
  - bash scripts/cicd/20.build.sh
  - echo \"+++ Tests - unit\"
  - bash scripts/cicd/30.test-unit.sh

plugins:
  - bureau14/qdb-artifacts#master:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"

timeout_in_minutes: 30

agents:
  queue: "{queue}"
