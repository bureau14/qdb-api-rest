label: ":golangci-lint: lint"
key: lint

# qdb-artifacts runs first (pre-command hook order) to populate qdb/ with
# the C API before 10.lint.sh starts: golangci-lint's typecheck compiles
# the cgo package and needs the headers.  The docker overlay
# (bureau14/builder:rhel7) is injected by pipeline.py::_lint_step via
# apply_docker so that the propagated env and the qdb/ volume are both
# visible inside the container -- the same container the build steps use.
plugins:
  - bureau14/qdb-artifacts#master:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"

commands:
  - bash scripts/cicd/10.lint.sh

timeout_in_minutes: 15

agents:
  queue: "default-debian-amd64"
